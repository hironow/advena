[project]
name = "genai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cloudevents>=2.2.0,<3",
    "fastapi>=0.139.0",
    "feedparser>=6.0.11",
    "firebase-admin>=7.5.0",
    "google-auth>=2.55.2",
    "google-cloud-aiplatform>=1.76.0",
    "google-cloud-firestore>=2.27.0",
    "google-cloud-storage>=2.19.0",
    "google-cloud-tasks>=2.23.0",
    "google-cloud-texttospeech>=2.37.0",
    "helium>=7.0.3",
    "litellm>=1.91.2",
    "lmnr[all]>=0.7.56",
    "pillow>=12.3.0",
    "pydantic>=2.13.4",
    "ratelimit>=2.2.1",
    "sickle>=0.7.0",
    "smolagents[litellm]>=1.26.0",
    "tenacity>=9.0.0",
    "types-protobuf>=7.34.1.20260518",
    "uvicorn>=0.51.0",
    "weave>=0.53.1",
]

[dependency-groups]
dev = [
    "mock-firestore",
    "pydantic-to-typescript>=2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.21",
    "tokencost>=0.1.17",
]


[tool.ruff]
exclude = ["dist", ".venv"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long, handled by black
    "B008", # do not perform function calls in argument defaults
    "C901", # too complex
    "W191", # indentation contains tabs
]

[tool.ruff.lint.isort]
known-third-party = []

[tool.ruff.lint.pyupgrade]
# Preserve types, even if a file imports `from __future__ import annotations`.
keep-runtime-typing = true

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"  # "class", "module", "package", "session"
norecursedirs = [".venv", "src/swarm/examples/*"]

[tool.uv.sources]
mock-firestore = { git = "https://github.com/hironow/python-mock-firestore.git" }
