[project]
name = "genai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cloudevents>=2.2.0,<3",
    "fastapi>=0.143.3",
    "feedparser>=6.0.14",
    "firebase-admin>=7.7.0",
    "google-auth>=2.62.0",
    "google-cloud-aiplatform>=2.5.0",
    "google-cloud-firestore>=2.34.0",
    "google-cloud-storage>=3.17.1",
    "google-cloud-tasks>=2.26.0",
    "google-cloud-texttospeech>=2.38.0",
    "google-genai>=2.30.1",
    "helium>=7.0.3",
    "lmnr[all]>=0.8.0",
    "pillow>=13.0.0",
    "pydantic>=2.14.1",
    "ratelimit>=2.2.1",
    "sickle>=0.7.0",
    "smolagents>=1.26.0",
    "tenacity>=9.0.0",
    "types-protobuf>=7.35.1.20260906",
    "uvicorn>=0.54.0",
    "weave>=0.53.11",
]

[dependency-groups]
dev = [
    "mock-firestore",
    "pydantic-to-typescript>=2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
    "tokencost>=0.1.17",
]


[tool.ruff]
exclude = ["dist", ".venv"]

[tool.uv]
# A dependency cooldown: only artifacts uploaded more than seven days ago are
# resolution candidates, so a compromised release is not pulled in on day zero.
# This is the control that would have blocked the 2026-10-21 litellm 1.107.0
# supply-chain release (live on PyPI for about two hours); the equivalent host
# setting is not tracked in this repository, so declare it here.
exclude-newer = "7 days"

# Security exception for certifi 2026.10.19 (uploaded 2026-10-20), scoped so it
# composes with the cooldown above instead of overriding it. Remove this dated
# exception after 2026-10-27T02:25:00Z, then regenerate and check uv.lock.
exclude-newer-package = { certifi = "2026-10-21T00:00:00Z" }

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long, handled by black
    "B008", # do not perform function calls in argument defaults
    "C901", # too complex
    "W191", # indentation contains tabs
]

[tool.ruff.lint.isort]
known-third-party = []

[tool.ruff.lint.pyupgrade]
# Preserve types, even if a file imports `from __future__ import annotations`.
keep-runtime-typing = true

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"  # "class", "module", "package", "session"
norecursedirs = [".venv", "src/swarm/examples/*"]

[tool.uv.sources]
mock-firestore = { git = "https://github.com/hironow/python-mock-firestore.git" }
