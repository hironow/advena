name: Test

on:
  push:
    branches:
      - main
      - develop
  # DO NOT use pull_request_target, use pull_request
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-test
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # Rust rewrite is distributed via the canary channel only; canary is a
          # moving tag, so never reuse a cached executable.
          bun-version: canary
          no-cache: true

      - name: Install dependencies
        run: bun install
        working-directory: ./frontend/web

      # inlined from mise task fe:test
      - name: Run test
        run: |
          set -eo pipefail
          bun run test
        working-directory: ./frontend/web

  backend:
    runs-on: ubuntu-24.04
    permissions:
      contents: 'read'
      id-token: 'write'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: 'google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093' # v3
        with:
          # use permissions above
          project_id: 'advena-dev'
          workload_identity_provider: 'projects/38358387786/locations/global/workloadIdentityPools/github/providers/my-repo'
          service_account: 'github-actions-on-advena@advena-dev.iam.gserviceaccount.com'

      - name: Set up Takumi Guard PyPI
        uses: flatt-security/setup-takumi-guard-pypi@bac24f8a97255d96a277f60de6906154ce0be096 # v1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: ./backend/genai/uv.lock

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: uv sync --frozen
        working-directory: ./backend/genai

      # inlined from mise task be:test (incl. its GOOGLE_CLOUD_PROJECT env)
      - name: Run test
        run: |
          set -eo pipefail
          uv run pytest --log-cli-level=INFO
        working-directory: ./backend/genai
        env:
          CI: 'true'
          GOOGLE_CLOUD_PROJECT: 'test-project'
