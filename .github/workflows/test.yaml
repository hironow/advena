name: Test

on:
  push:
    branches:
      - main
      - develop
  # DO NOT use pull_request_target, use pull_request
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-test
  cancel-in-progress: true

jobs:
  frontend:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node LTS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # Rust rewrite is distributed via the canary channel only; canary is a
          # moving tag, so never reuse a cached executable.
          bun-version: canary
          no-cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: ./frontend/web

      # inlined from mise task fe:test
      - name: Run test
        run: |
          set -eo pipefail
          bun run test
        working-directory: ./frontend/web

  backend:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    permissions:
      contents: 'read'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: ./backend/genai/uv.lock

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: uv sync --frozen
        working-directory: ./backend/genai

      # inlined from mise task be:test (incl. its GOOGLE_CLOUD_PROJECT env)
      - name: Run test
        run: |
          set -eo pipefail
          uv run pytest --log-cli-level=INFO
        working-directory: ./backend/genai
        env:
          CI: 'true'
          GOOGLE_CLOUD_PROJECT: 'test-project'
