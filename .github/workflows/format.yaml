name: Format

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-format
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Use mise
        run: |
          curl https://mise.run | sh
          echo "$HOME/.local/share/mise/bin" >> $GITHUB_PATH
          echo "$HOME/.local/share/mise/shims" >> $GITHUB_PATH

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Vite Plus
        run: curl -fsSL https://vite.plus | bash

      - name: Install dependencies
        run: bun install
        working-directory: ./frontend/web

      - name: Run format check
        run: |
          vp fmt
          git diff --exit-code
        working-directory: ./frontend/web

      - name: Show formatting diff on failure
        if: failure()
        run: git diff
        working-directory: ./frontend/web

  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Use mise
        run: |
          curl https://mise.run | sh
          echo "$HOME/.local/share/mise/bin" >> $GITHUB_PATH
          echo "$HOME/.local/share/mise/shims" >> $GITHUB_PATH

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: ./backend/genai/uv.lock

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: mise exec -- uv sync --frozen
        working-directory: ./backend/genai

      - name: Run format
        run: |
          mise run be:format
          git diff --exit-code
        working-directory: ./backend/genai

      - name: Show formatting diff on failure
        if: failure()
        run: git diff
        working-directory: ./backend/genai

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install json2ts
        run: bun install -g json-schema-to-typescript
        # below python to typescript gen requires json2ts

      - name: Run gen
        run: |
          mise run be:gen
          git diff --exit-code
        working-directory: ./backend/genai

      - name: Show gen diff on failure
        if: failure()
        run: git diff
        working-directory: ./backend/genai
