name: Format

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-format
  cancel-in-progress: true

jobs:
  frontend:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Vite Plus
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          run-install: false
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: canary
          no-cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: ./frontend/web

      - name: Run format check
        run: |
          vp fmt
          git diff --exit-code
        working-directory: ./frontend/web

      - name: Show formatting diff on failure
        if: failure()
        run: git diff
        working-directory: ./frontend/web

  backend:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    permissions:
      contents: 'read'
      id-token: 'write'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: ./backend/genai/uv.lock

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: uv sync --frozen
        working-directory: ./backend/genai

      # inlined from mise task be:format
      - name: Run format
        run: |
          uv run ruff check --select I --fix
          uv run ruff format
          git diff --exit-code
        working-directory: ./backend/genai
        env:
          UV_FROZEN: 'true'

      - name: Show formatting diff on failure
        if: failure()
        run: git diff
        working-directory: ./backend/genai

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # Rust rewrite is distributed via the canary channel only; canary is a
          # moving tag, so never reuse a cached executable.
          bun-version: canary
          no-cache: true

      - name: Install json2ts
        run: bun install -g json-schema-to-typescript
        # below python to typescript gen requires json2ts

      # inlined from mise task be:gen
      - name: Run gen
        run: |
          set -eo pipefail
          ENTITY_DIR=./src/event_sourcing/entity
          GENERATED_DIR=../../frontend/web/lib/firestore/generated
          PYTHONPATH=$(pwd) uv run pydantic2ts --module ${ENTITY_DIR}/user.py --output ${GENERATED_DIR}/entity_user.ts
          PYTHONPATH=$(pwd) uv run pydantic2ts --module ${ENTITY_DIR}/radio_show.py --output ${GENERATED_DIR}/entity_radio_show.ts
          PYTHONPATH=$(pwd) uv run pydantic2ts --module ${ENTITY_DIR}/user_keyword.py --output ${GENERATED_DIR}/entity_user_keyword.ts --exclude User --exclude UserId
          git diff --exit-code
        working-directory: ./backend/genai
        env:
          UV_FROZEN: 'true'

      - name: Show gen diff on failure
        if: failure()
        run: git diff
        working-directory: ./backend/genai

  workflows:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - run: just install-actionlint lint-workflows
