# Dependabot version updates (first-party; replaces Renovate where present).
# hironow house style (firepact/tablecodec/dotfiles): 7-day cooldown for
# supply-chain hardening (security updates bypass it), and each ecosystem
# grouped into a single PR so a week's bumps land together.
version: 2
updates:

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels: ["dependencies", "github-actions"]
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns: ["*"]

  # bun ecosystem: regenerates bun.lock alongside package.json. The old "npm"
  # ecosystem only rewrote package.json and left bun.lock stale, desyncing the
  # lockfile on every bump (had to be hand-synced on PR #146).
  - package-ecosystem: "bun"
    directory: "/frontend/web"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels: ["dependencies", "npm"]
    commit-message:
      prefix: "chore"
      include: "scope"
    # Hold the TypeScript major (6->7). TS7 is the Go-native rewrite: it drops
    # the classic 'main: ./lib/typescript.js' entry point, so next 16 thinks
    # typescript is missing and dies trying to auto-install it during the
    # Docker build. Take the rest of the weekly npm group. Revisit once next
    # supports TS7 (crediflow holds the same major for its own reason).
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: "uv"
    directory: "/backend/genai"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels: ["dependencies", "uv"]
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      uv:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directories:
      - "/backend/genai"
      - "/frontend/web"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      docker:
        patterns: ["*"]
